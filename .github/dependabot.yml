# Weekly, grouped, labeled. The npm ecosystem entry watches devDependencies only in
# practice: the runtime dependency policy is ZERO dependencies (ADR-0020), the
# `dependencies` block does not exist, and CI fails if one appears. Watching the dev tree
# is still SOC 2 CC7.1 hygiene — the toolchain builds what ships.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, ci]
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies]
    groups:
      dev:
        patterns: ["*"]
        # Minor and patch only: each MAJOR arrives as its own PR, so one breaking major (TS 7,
        # ESLint 10, Vitest 5 — all at once in September 2026) cannot hold every routine bump.
        update-types: [minor, patch]
    ignore:
      # TypeScript 7 breaks this repo's tooling (typescript-eslint / @astrojs/check reject it) —
      # the recurring red PR of every Dependabot round since August. Remove this entry when the
      # tooling supports TS 7.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

# Weekly, grouped, labeled. The npm ecosystem entry watches devDependencies only in
# practice: the runtime dependency policy is ZERO dependencies (ADR-0020), the
# `dependencies` block does not exist, and CI fails if one appears. Watching the dev tree
# is still SOC 2 CC7.1 hygiene — the toolchain builds what ships.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, ci]
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies]
    groups:
      dev:
        patterns: ["*"]
